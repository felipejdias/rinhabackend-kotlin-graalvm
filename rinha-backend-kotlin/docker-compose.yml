# Todos os servicos usam network_mode: host (sem rede bridge e sem publicacao de portas).
# No Windows/Docker Desktop o proxy de publicacao de porta (WSL2/vpnkit) engasga sob alta
# concorrencia de conexoes e derruba requisicoes sem erro nenhum na aplicacao - mesmo problema
# visto no projeto teste-itau. Com host networking nao existe NAT/proxy entre nginx, apis e banco,
# e o Gatling rodando com --network host (scripts/run-load-test.ps1) tambem nao passa por ele.
# Requer Docker Desktop 4.34+ com "Enable host networking" ligado em Settings > Resources > Network.
services:
  api01: &api
    image: rinha-backend-2024-q1:latest
    build:
      context: ..
      dockerfile: rinha-backend-kotlin/Dockerfile
    network_mode: host
    environment:
      - SERVER_PORT=8081
      - DB_HOSTNAME=localhost
      # pool pequeno: o banco tem 0.5 CPU, 2x50 conexoes so gastavam memoria do postgres
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=15
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=15
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "100MB"

  api02:
    <<: *api
    environment:
      - SERVER_PORT=8082
      - DB_HOSTNAME=localhost
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=15
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=15
      # pool pequeno: o banco tem 0.5 CPU, 2x50 conexoes so gastavam memoria do postgres
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=15
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=15

  nginx:
    image: nginx:1.30-alpine
    container_name: 'nginx'
    network_mode: host
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "20MB"

  db:
    image: postgres:18-alpine
    command: 'postgres -c max_connections=102 -c shared_buffers=16MB -c checkpoint_timeout=600 -c synchronous_commit=off -c fsync=off -c full_page_writes=off -c work_mem=4MB'
    container_name: 'postgress'
    network_mode: host
    environment:
      - POSTGRES_PASSWORD=123
      - POSTGRES_USER=admin
      - POSTGRES_DB=rinha-backend
    volumes:
      - ./scripts/script.sql:/docker-entrypoint-initdb.d/script.sql
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "330MB"
