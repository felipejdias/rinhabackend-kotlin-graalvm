# 1 worker basta para 0.2 CPU; "auto" pegaria todas as CPUs da VM (host network) e estouraria a memoria
worker_processes 1;

events {
    # cada requisicao usa 2 conexoes (cliente + upstream); 1000 estourou no pico do Gatling
    worker_connections 4096;
}

http {
    access_log off;
    sendfile   on;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    # network_mode: host -> as APIs nao tem mais nome de servico, ficam em portas diferentes do localhost
    upstream api {
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
        # reaproveita conexoes com as APIs em vez de abrir uma por requisicao
        keepalive 256;
    }

    server {
        listen 9999;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }
    }
}
